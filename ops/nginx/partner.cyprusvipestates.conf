# Partner portal vhost — TEMPLATE (2026-10-18), not yet live on the VPS.
#
# The operator applies this by hand, in this order:
#   1. DNS: A record partner.cyprusvipestates.com → the production VPS.
#   2. TLS: issue the certificate with certbot first (the ssl_certificate paths below do not exist before that).
#   3. Copy to /etc/nginx/sites-enabled/partner.cyprusvipestates, `nginx -t`, `systemctl reload nginx`.
#   4. Set PARTNER_HOST=partner.cyprusvipestates.com in the app env (the middleware rewrites this host
#      to the internal /partner-portal segment).
#
# ALLOWLIST: only the portal pages and the assets they need reach the app. Every other app surface
# (API, admin, CRM, booking/presentation links, previews, uploads, SEO files ...) answers 404 here,
# so the partner host can never be used as a second entry point to the main site.

server {
    server_name partner.cyprusvipestates.com;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml+rss image/svg+xml;

    access_log /var/log/nginx/cvp-partner-access.log;
    error_log  /var/log/nginx/cvp-partner-error.log;

    # Allowed assets.
    location ^~ /_next/      { include /etc/nginx/snippets/cvp_proxy.conf; }
    location ^~ /crm/fonts/  { include /etc/nginx/snippets/cvp_proxy.conf; }
    location = /favicon.ico  { include /etc/nginx/snippets/cvp_proxy.conf; }
    location = /icon.png     { include /etc/nginx/snippets/cvp_proxy.conf; }
    location = /apple-icon.png { include /etc/nginx/snippets/cvp_proxy.conf; }

    # Blocked app surfaces ("^~" prefix matches win over the catch-all "/" below).
    location ^~ /api          { return 404; }
    location ^~ /admin        { return 404; }
    location ^~ /crm          { return 404; }  # /crm/fonts/ above is the longer prefix and stays allowed
    location ^~ /c/           { return 404; }
    location ^~ /book/        { return 404; }
    location ^~ /preview-     { return 404; }
    location ^~ /sandbox      { return 404; }
    location ^~ /style        { return 404; }
    location ^~ /structure    { return 404; }
    location ^~ /uploads      { return 404; }
    location ^~ /og           { return 404; }
    location ^~ /img          { return 404; }
    location ^~ /.well-known  { return 404; }
    location ^~ /robots       { return 404; }
    location ^~ /sitemap      { return 404; }
    location ^~ /partner-portal { return 404; }

    # Portal pages (/login, /register, /home, /profile ...).
    location / { include /etc/nginx/snippets/cvp_proxy.conf; }

    # Issue with certbot first (step 2 above); these lines mirror the main vhost.
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/partner.cyprusvipestates.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner.cyprusvipestates.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name partner.cyprusvipestates.com;
    return 301 https://$host$request_uri;
}
