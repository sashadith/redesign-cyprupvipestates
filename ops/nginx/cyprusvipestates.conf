server {
    server_name cyprusvipestates.com www.cyprusvipestates.com;

    # Canonical host is the non-www apex.
    if ($host = www.cyprusvipestates.com) { return 301 https://cyprusvipestates.com$request_uri; }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;


    client_max_body_size 50M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml+rss image/svg+xml;

    access_log /var/log/nginx/cvp-access.log;
    error_log  /var/log/nginx/cvp-error.log;

    # English is the default locale, served WITHOUT a prefix → strip any /en (301 to clean URL).
    # Known /en/ chain starts go to the final page in one hop (map at the top of this file).
    if ($cvp_en_final) { return 301 $cvp_en_final; }

    location = /en { return 301 /; }

    # A link written "https:/cyprusvipestates.com/en/blog" (one slash) is read as a relative path, so
    # Google crawled /ru/https:/cyprusvipestates.com/en/case-studies. Next.js answers 404 to any path
    # with a dot or colon segment before the app is reached, so it is mapped here: drop the bogus
    # prefix (and a leading /en) and go in one hop to the page that was meant.
    location ~* "^/(?:(?:de|pl|ru|he|en)/)?https?:/+(?:www\.)?cyprusvipestates\.com/en(?:/(.*))?$" { return 301 https://cyprusvipestates.com/$1; }
    location ~* "^/(?:(?:de|pl|ru|he|en)/)?https?:/+(?:www\.)?cyprusvipestates\.com(?:/(.*))?$" { return 301 https://cyprusvipestates.com/$1; }

    # /en/properties(/*) collapses DIRECTLY to /projects — must be checked
    # before the generic "^~ /en/" rewrite below; nginx picks the LONGEST
    # matching "^~" prefix, so this one wins for anything under
    # /en/properties regardless of file order. Matches the app's own
    # /properties -> /projects redirect (propMatch in middleware.ts) so
    # /en/properties never chains through /properties first (it did until
    # 2026-07-19: /en/properties -> 307 -> /properties -> 308 -> /projects).
    # NOT a bare "^~ /en/properties": that prefix also swallows the landing pages
    # /en/properties-paphos, /en/properties-in-cyprus ... whose rewrite regex then
    # fails to match, so they skipped the generic /en/ rule below and 404ed (GSC 404
    # report 2026-10-11). Exact + slash-bounded prefix keeps them on the generic rule.
    location = /en/properties { return 301 /projects; }
    location ^~ /en/properties/ { rewrite ^/en/properties/.*$ /projects permanent; }

    # Legacy Project slugs merged into their Development on 2026-08-30 (see
    # docs/PROJECT-DEVELOPMENT-OVERLAP-DEFECT.md) — each has its own
    # legacyProjectRedirect row, checked by /projects/[slug]/page.tsx, so
    # /projects/{old-slug} itself is already a single 308 hop. But the
    # generic "^~ /en/" rewrite below strips the /en prefix with NO
    # knowledge of that table, so /en/projects/{old-slug} chained through
    # it first: 301 -> /projects/{old-slug} -> 308 -> /projects/{new-slug}.
    # Same "exact match wins over a shorter prefix" technique as
    # /en/properties above skips straight to the real target instead.
    # `tress` is deliberately absent: its legacy slug and Development slug
    # are both literally "tress", so /en/projects/tress already lands in a
    # single hop and needs no entry here.
    location = /en/projects/villas-cap-st-georges-resort { return 301 /projects/cap-st-georges-resort; }
    location = /en/projects/the-gallery { return 301 /projects/gallery; }
    location = /en/projects/atrium-townhouses { return 301 /projects/atrium; }
    location = /en/projects/atrium-apartments { return 301 /projects/atrium; }
    location = /en/projects/inner-city-3-apartments { return 301 /projects/inner-city-3; }

    # Legacy /en/ URLs whose unprefixed page is itself gone: the generic rule below would strip /en
    # and then the app redirects again (two hops). GSC 404 report 2026-10-11: send each straight to
    # the final page. Same exact-match technique as the five /en/projects/* entries above.
    location = /en/projects/projektowanie { return 301 /projects; }
    location = /en/projects/eden-coast-apartment { return 301 /projects; }
    location = /en/projects/seaview-heights-villas-cybarco { return 301 /projects/seaview-heights; }
    location = /en/blog/mozhno-li-sdat-v-arendu-elitnyi-dom-na-kipre-i-skolko-eto-prinosit-deneg { return 301 /blog/rent-luxury-property-cyprus-income-guide; }
    location = /en/nedvizhimost-na-kipre-s-panoramnymi-vidami { return 301 /ru/nedvizhimost-na-kipre-s-panoramnymi-vidami; }
    location = /en/projects/olea-residences-pafilia { return 301 /developers/pafilia; }
    location = /en/projects/konia-aura-domenica { return 301 /developers/domenica-group; }
    location = /en/projects/eden-coast-villa { return 301 /projects; }
    location = /en/blog/apartamenty-na-cyprze { return 301 /blog; }
    location = /en/projects/projects { return 301 /projects; }
    location = /en/blog/top-100-properties-in-cyprus { return 301 /blog; }
    location = /en/villy-u-morya-kipr { return 301 /beachfront-villas-cyprus; }
    location = /en/projects/pearl-park-aristo { return 301 /projects/pearl-park-residences; }
    location = /en/projects/meteora-residences-aristo { return 301 /projects/meteora-residential-development; }

    # NOTE: no exact-match exclude blocks for the 24 title-sweep paths here.
    # Historical access logs (checked 2026-07-19) prove the blanket rule below
    # has already been permanently 301-redirecting every /en/ path, including
    # all 24 of those, continuously since before EITHER sweep batch (07-07,
    # 07-18) was deployed — they were never on a temporary 307 in production.
    # Adding exclude blocks here would have REGRESSED them from their actual
    # long-standing 301 to a new 307, mid-window — the opposite of "leave
    # them untouched." See docs/SEO-TITLE-SWEEP-LOG.md for the full note.
    location ^~ /en/ { rewrite ^/en/(.*)$ /$1 permanent; }

    # Static assets served directly (perf)
    location ^~ /_next/static/ {
        alias /var/www/cyprusvipestates/.next/static/;
        expires 1y; add_header Cache-Control "public, immutable";
    }
    location ^~ /uploads/ {
        alias /var/www/cyprusvipestates/public/uploads/;
        expires 30d; add_header Cache-Control "public";
        access_log off;
    }

    # Infra paths → proxy (never locale-redirected)
    location ^~ /_next/   { include /etc/nginx/snippets/cvp_proxy.conf; }
    # The WhatsApp gateway cannot send custom headers (verified 2026-10-17:
    # a webhook created with headers stores no such field) and refuses a
    # 127.0.0.1 destination, so its secret has to ride in the query string.
    # Logging is off for this one path so the secret never reaches the access
    # log; errors still go to the error log, and the app logs refusals itself.
    location = /api/webhooks/whatsapp-inbound {
        access_log off;
        include /etc/nginx/snippets/cvp_proxy.conf;
    }
    location ^~ /api/     { include /etc/nginx/snippets/cvp_proxy.conf; }
    # Partner portal (2026-10-22): the internal /partner-portal segment is only served on
    # partner.cyprusvipestates.com (see partner.cyprusvipestates.conf); the middleware also 404s it here.
    location ^~ /partner-portal { return 404; }
    location ^~ /admin    { add_header X-Robots-Tag "noindex, nofollow" always; include /etc/nginx/snippets/cvp_proxy_admin.conf; }
    location ^~ /sitemaps/ { include /etc/nginx/snippets/cvp_proxy.conf; }
    location = /sitemap.xml { include /etc/nginx/snippets/cvp_proxy.conf; }
    location = /robots.txt  { include /etc/nginx/snippets/cvp_proxy.conf; }
    location = /favicon.ico { include /etc/nginx/snippets/cvp_proxy.conf; }

    # Non-default locale pages (/de, /pl, /ru and below) → proxy
    # he added 2026-09-14 (Hebrew locale). Harmless before launch: the app answers 404 for /he while NEXT_PUBLIC_LIVE_LOCALES excludes it.
    location ~ ^/(de|pl|ru|he)(/|$) { include /etc/nginx/snippets/cvp_proxy.conf; }

    # German villa-cluster consolidation (2026-07-28): grosse-villen-zypern merged
    # into luxusvillen-in-zypern (identical filterPropertyType=Villa/no-city live
    # query, confirmed duplicate, not just similar copy). Exact-match location
    # wins over the generic cvp_de_only map below regardless of file order, so
    # this root legacy URL 301s directly to the final /de/ target in one hop —
    # removed from the map above rather than left to chain through /de/grosse-
    # villen-zypern first. The middleware-level redirect for anyone hitting the
    # /de/ URL directly lives in src/middleware.ts (DE_LANDING_MERGES).
    location = /grosse-villen-zypern { return 301 /de/luxusvillen-in-zypern; }

    # One-hop redirects for old German no-prefix URLs whose /de/ twin is itself redirected by the app
    # (src/middleware.ts: DE_LANDING_MERGES, RETIRED_BLOG_REDIRECTS, nestedPageRedirects.json, project merges).
    # They used to be in the cvp_de_only map: nginx 301 -> /de/<same> and the app then 308/301'd again
    # (a two-hop chain; 21 of the 77 map entries, found in the GSC 5xx follow-up 2026-10-13). Exact
    # locations win over the generic map, so each goes straight to the final page. If a target moves,
    # update the line here too: nginx does not follow the app's redirect tables.
    location = /blog/mieteinnahmen-aus-deutschland-in-zypern-versteuern { return 301 /de/blog/immobilien-zypern-mit-garantierten-mieteinnahmen$is_args$args; }
    location = /blog/wie-rentner-aus-deutschland-immobilien-auf-zypern-erwerben-koennen { return 301 /de/blog/ratgeber-fuer-deutsche-rentner$is_args$args; }
    location = /haeuser-in-zypern-fuer-investoren { return 301 /de/haeuser-auf-zypern/haeuser-in-zypern-fuer-investoren$is_args$args; }
    location = /haus-mit-pool-auf-zypern { return 301 /de/haeuser-auf-zypern/haus-mit-pool-auf-zypern$is_args$args; }
    location = /luxus-haeuser-zum-verkauf-in-paphos { return 301 /de/haeuser-auf-zypern/luxus-haeuser-zum-verkauf-in-paphos$is_args$args; }
    location = /strandhaus-auf-zypern { return 301 /de/haeuser-auf-zypern/strandhaus-auf-zypern$is_args$args; }
    location = /luxusvillen-in-zypern/villen-in-paphos { return 301 /de/luxusvillen-in-zypern$is_args$args; }
    location = /luxusvillen-zypern-ueber-1-mio { return 301 /de/luxusvillen-in-zypern$is_args$args; }
    location = /projects/akamantis-gardens-villen { return 301 /de/developers/leptos-estates$is_args$args; }
    location = /projects/atrium-stadthaeuser { return 301 /de/projects/atrium$is_args$args; }
    location = /projects/city-9-residences-villen-in-zypern { return 301 /de/developers/korantina-homes$is_args$args; }
    location = /projects/city-landmark-ferienwohnungen-in-zypern { return 301 /de/projects/city-landmark$is_args$args; }
    location = /projects/inner-city-3-ferienwohnungen-in-zypern { return 301 /de/projects/inner-city-3$is_args$args; }
    location = /projects/villen-cap-st-georges-resort { return 301 /de/projects/cap-st-georges-resort$is_args$args; }
    location = /projects/villen-golden-view-villas { return 301 /de/projects/golden-view-villas-phase-6$is_args$args; }
    location = /projects/villen-sentire-park-villas { return 301 /de/projects/tenera-villas-1a-1b$is_args$args; }
    location = /villen-auf-zypern-fuer-auswanderer { return 301 /de/luxusvillen-in-zypern$is_args$args; }
    location = /villen-in-zypern-fuer-investoren { return 301 /de/luxusvillen-in-zypern$is_args$args; }
    location = /villen-zypern-aufenthaltstitel-provisionsfrei { return 301 /de/luxusvillen-in-zypern$is_args$args; }
    location = /wohnungen-auf-zypern-fuer-investoren { return 301 /de/apartment-zypern$is_args$args; }
    location = /wohnungen-fuer-junge-familien-zypern { return 301 /de/apartment-zypern$is_args$args; }

    # German "Häuser" cluster consolidation (2026-07-28) REVERSED 2026-09-11:
    # see docs/SITE-CHANGELOG.md and src/middleware.ts (DE_LANDING_MERGES) for
    # the full reasoning — "haus zypern kaufen" (3600/mo) has 7.5x the search
    # volume of "villa zypern kaufen" (480/mo), and the original merge
    # rationale (shared live-query filter, or a stale archived-project
    # overlap) never established shared search intent. All 5 bare paths moved
    # back into the cvp_de_only map above, so they 301 to their real /de/ page
    # again instead of the villa flagship.

    # Everything else is an English (default-locale) bare path served by the app —
    # EXCEPT old German no-prefix URLs with no English equivalent, which 301 to /de.
    location = /api      { return 404; }
    location = /_next    { return 404; }
    location = /sitemaps { return 404; }
    location / {
        if ($cvp_de_only) { return 301 /de$uri$is_args$args; }
        include /etc/nginx/snippets/cvp_proxy.conf;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cyprusvipestates.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cyprusvipestates.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


